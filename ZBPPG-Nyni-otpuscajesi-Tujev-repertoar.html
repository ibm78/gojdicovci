<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repertoár – Gojdičovci</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: #203a30; font: 1rem/1.5 "DM Sans", system-ui, sans-serif; }
  main { max-width: 58rem; margin: auto; padding: 1rem; display: grid; gap: 1rem; }
  article { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: clamp(.5rem, 3vw, 1.25rem); background: white; border: 1px solid #d9e0d6; border-left: .35rem solid #25513d; border-radius: .75rem; padding: clamp(1rem, 4vw, 2rem); }
  .song-info { min-width: 0; overflow-wrap: anywhere; }
  h2 { font-family: Georgia, serif; font-size: clamp(1.1rem, 3vw, 1.5rem); line-height: 1.15; margin: 0 0 .4rem; }
  p { margin: 0; color: #485a50; font-size: 1.1rem; }
  nav { display: flex; gap: clamp(.25rem, 2vw, .65rem); }
  a { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: .65rem; border: 1px solid #25513d; color: #203a30; text-decoration: none; }
  a:hover { background: #e9f0ea; }
  a:focus-visible { outline: 3px solid #165a9e; outline-offset: 3px; }
  a.play { background: #25513d; color: white; border-color: #25513d; }
  a.play:hover { background: #193e2c; }
  .icon { display: block; width: 1.5rem; height: 1.5rem; }
  .download-icon { position: relative; border-bottom: .18rem solid; border-radius: 0 0 .15rem .15rem; }
  .download-icon::before { content: ""; position: absolute; inset: 0 12% 18%; background: currentColor; clip-path: polygon(40% 0,60% 0,60% 55%,100% 55%,50% 100%,0 55%,40% 55%); }
  .play-icon { background: currentColor; clip-path: polygon(22% 8%,88% 50%,22% 92%); }
  @media (max-width: 480px) {
    main { padding: 0; }
    article { padding: .25rem .5rem; gap: .4rem; }
    h2 { font-size: 1rem; line-height: 1.15; margin-bottom: .125rem; }
    p { font-size: .8125rem; line-height: 1.2; }
    nav { gap: .25rem; }
    a { width: 2.75rem; height: 2.75rem; }
  }
</style>
</head>
<body>
<main aria-label="Repertoár zboru">
  <article aria-labelledby="pod-tvoju-milost">
    <div class="song-info">
      <h2 id="pod-tvoju-milost">Nyni otpuščaješi</h2>
      <p>Konstantin Tujev</p>
    </div>
    <nav aria-label="Nyni otpuščaješi">
      <a href="ZBPPG-Nyni-otpuscajesi-Tujev.pdf" download="ZBPPG-Nyni-otpuscajesi-Tujev.pdf" aria-label="Stiahnuť PDF" title="Stiahnuť PDF"><span class="icon download-icon" aria-hidden="true"></span></a>
      <a class="play" href="ZBPPG-Nyni-otpuscajesi-Tujev-player.html" target="_blank" rel="noopener" aria-label="Ukáž a prehraj" title="Ukáž a prehraj"><span class="icon play-icon" aria-hidden="true"></span></a>
    </nav>
  </article>
</main>
</body>
</html>
